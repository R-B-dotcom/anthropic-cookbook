<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Chip 3D Viewer</title>
  <style>
    body { margin:0; background:#060914; color:#e7ebff; font-family:-apple-system,sans-serif; }
    #ui { position:fixed; top:10px; left:10px; right:10px; z-index:2; background:rgba(8,14,28,.75); border:1px solid #2e3f7d; border-radius:12px; padding:10px; }
    #ui a { color:#5dd8ff; }
    #c { width:100vw; height:100vh; display:block; }
  </style>
</head>
<body>
  <div id="ui"><strong>AI Chip Module</strong> · drag to rotate, pinch/scroll to zoom · <a href="iphone_quick_view.html">back</a></div>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060914);

    const camera = new THREE.PerspectiveCamera(45, 2, 0.1, 1000);
    camera.position.set(90, 70, 90);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(30, 8, 30);

    scene.add(new THREE.HemisphereLight(0xbfd5ff, 0x132136, 1.0));
    const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(80,100,30); scene.add(key);

    const substrate = new THREE.Mesh(new THREE.BoxGeometry(60,1.6,60), new THREE.MeshStandardMaterial({color:0x1f7c53, roughness:0.7}));
    substrate.position.set(30,0.8,30); scene.add(substrate);

    const die = new THREE.Mesh(new THREE.BoxGeometry(28,2.5,28), new THREE.MeshStandardMaterial({color:0x0f0f13, roughness:0.25}));
    die.position.set(30,3.0,30); scene.add(die);

    const interposer = new THREE.Mesh(new THREE.BoxGeometry(35,1.2,35), new THREE.MeshStandardMaterial({color:0x4d5562, roughness:0.4}));
    interposer.position.set(30,2.2,30); scene.add(interposer);

    const memMat = new THREE.MeshStandardMaterial({color:0x1f2e74, roughness:0.4});
    [[8,20],[8,32],[46,20],[46,32]].forEach(([x,z]) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(6,3.5,8), memMat);
      m.position.set(x+3,3.35,z+4); scene.add(m);
    });

    const frame = new THREE.Mesh(new THREE.BoxGeometry(40,1.8,40), new THREE.MeshStandardMaterial({color:0xc5c8cf, metalness:0.45, roughness:0.35}));
    frame.position.set(30,6.5,30); scene.add(frame);

    const finMat = new THREE.MeshStandardMaterial({color:0xe0e3e8, metalness:0.4, roughness:0.3});
    for (let i=0;i<14;i++) {
      const fin = new THREE.Mesh(new THREE.BoxGeometry(0.9,10,34), finMat);
      fin.position.set(13 + i*2.3, 11.4, 30); scene.add(fin);
    }

    const pcbEdge = new THREE.Mesh(new THREE.BoxGeometry(24,1.8,4), new THREE.MeshStandardMaterial({color:0xd4af37, metalness:0.7, roughness:0.35}));
    pcbEdge.position.set(30,1.7,-2); scene.add(pcbEdge);

    function onResize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', onResize); onResize();

    renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene,camera); });
  </script>
</body>
</html>
